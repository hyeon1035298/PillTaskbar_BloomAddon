# The add-on's names, set here only. tools/build-addon.sh reads this file (ADDON_CONF
# picks another add-on's), and tools/make-identity.py turns it into gen/addon_identity.h
# for common/addon_protocol.h and gen/identity.json for make-manifest.py.
# Paths are relative to this file's folder. Lists are space separated.

# Data folder <Bloom local>\addons\<id>, Local\Bloom.Addon.<id>.* objects, WH_MOD_ID, addon.json id.
ADDON_ID="pill-taskbar"
# <name>Host.exe, <name>Runtime.dll, <name>.dll and the explorer-side Local\<name>.*.<pid> objects.
ADDON_NAME="PillTaskbar"
ADDON_VERSION="0.2.4"
ADDON_MOD_SRC="../pill-taskbar.wh.cpp"
ADDON_MOD_VERSION="0.1"
# Windhawk mod ids: the host and runtime refuse while one of these is on in Windhawk.
ADDON_WINDHAWK_MODS="local@pill-taskbar"
# Modules the host resolves symbols.txt in. ":core" lives in the Client.Core package
# folder (a copy explorer has loaded wins); the rest come from System32.
ADDON_SYMBOL_MODULES="taskbar.dll Taskbar.View.dll:core SystemTray.dll:core"
# 1: build settings.schema.json (needs tools/names-en.tsv) and list it in addon.json.
ADDON_SCHEMA="1"
# A JSON object whose values replace the mod's YAML defaults (empty: none).
ADDON_VALUES_DEFAULTS=""
ADDON_THIRD_PARTY="../THIRD_PARTY.md"

# addon.json
ADDON_NAME_KO="PillTaskbar"
ADDON_NAME_EN="PillTaskbar"
ADDON_ABOUT_KO="작업표시줄을 가운데 알약 모양으로 바꿉니다"
ADDON_ABOUT_EN="Turns the taskbar into a centered pill"
ADDON_LICENSE="GPL-3.0-only"
ADDON_SOURCE="https://github.com/hyeon1035298/PillTaskbar_BloomAddon"
ADDON_MIN_BLOOM="0.18.0"
ADDON_NEEDS="usageExport"
